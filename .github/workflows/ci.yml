name: CI / SRE Microservice Quality Gate

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy ruff

      - name: Static Type Audit (mypy strict mode)
        run: |
          HOME=/tmp python -m mypy --strict src/ tests/

      - name: Linter & Formatting Audit (ruff)
        run: |
          python -m ruff check src/ tests/
          python -m ruff format --check src/ tests/

      - name: Test Suite & Coverage Report (pytest)
        env:
          REDIS_URL: redis://localhost:6379
          HOME: /tmp
          CREWAI_STORAGE_DIR: /tmp/crewai_storage
          CREWAI_DISABLE_TELEMETRY: "true"
        run: |
          python -m pytest --cov=src --cov-report=term-missing tests/
